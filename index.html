/* ============ Full moment view ============ */
const findEntry = id => [...state.entries, ...OTHERS].find(x => String(x.id) === String(id));

// "30th October 2026"
function fmtLongDate(d) {
  const n = d.getDate(), s = n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
  return `${n}${s} ${d.toLocaleDateString("en-GB", { month: "long" })} ${d.getFullYear()}`;
}

// How many moments were recorded across everyone on that day — the same number the public month grid shows
function dayCount(d) {
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  return Math.max(1, countFor(day, "public") || 0);
}

screens.day = dayScreen;

const bookmarkBtn = id => {
  const on = state.bookmarks.has(String(id));
  return `<button class="btn-white btn-round" id="bookmark-btn" data-action="bookmark" data-value="${id}" aria-pressed="${on}" aria-label="${on ? "Remove bookmark" : "Bookmark"}">${on ? ICONS.bookmarkFilled : ICONS.bookmark}</button>`;
};

screens.moment = id => {
  const e = findEntry(id);
  if (!e) return placeholder("moment");
  const metaParts = e.own ? [e.place].filter(Boolean) : [attribution(e)];
  return {
    html: `
      ${topbar()}
      <div class="moment-nav">
        <button class="btn-dark btn-round" data-action="back" aria-label="Back">${ICONS.back}</button>
        ${showChapter(e) ? `
          <div class="moment-chapter">
            <span class="moment-chapter-label">Belongs to chapter:</span>
            <a class="btn-white" href="#chapter/${encodeURIComponent(e.chapter)}"><span>${esc(e.chapter)}</span>${ICONS.arrowRight}</a>
          </div>` : ""}
      </div>

      <div class="moment-body">
        <article class="moment-card" aria-labelledby="moment-date">
          <div class="moment-main">
            <h1 class="moment-date serif" id="moment-date">${fmtLongDate(e.createdAt)}</h1>
            ${e.text ? `<p class="moment-text">${esc(e.text)}</p>` : ""}
            ${e.photo ? `<div class="moment-photo">${typeof e.photo === "string" ? `<img src="${e.photo}" alt="Photo from this moment">` : `<span role="img" aria-label="Photo attached">${ICONS.photoLg}</span>`}</div>` : ""}
            ${e.audioDuration ? audioBar(e) : ""}
          </div>
          <div class="moment-meta">
            ${metaParts.map(t => `<span class="moment-place">${esc(t)}</span><span class="moment-dot" aria-hidden="true"></span>`).join("")}
            <span class="moment-count">One of ${dayCount(e.createdAt)} recorded on this day</span>
          </div>
        </article>

        <div class="moment-actions">
          <button class="btn-white btn-round" data-action="share" data-value="${e.id}" aria-label="Share">${ICONS.share}</button>
          ${e.own ? `<a class="btn-white btn-round" href="#edit/${e.id}" aria-label="Edit">${ICONS.edit}</a>` : ""}
          ${bookmarkBtn(e.id)}
          <button class="btn-white btn-round" data-action="moment-more" data-value="${e.id}" aria-label="More options">${ICONS.dots}</button>
        </div>
      </div>`,
  };
};

function toast(message) {
  document.querySelector(".toast-layer")?.remove();
  const layer = document.createElement("div");
  layer.className = "toast-layer";
  layer.innerHTML = `<div class="toast" role="status">${esc(message)}</div>`;
  document.body.appendChild(layer);
  const t = layer.firstElementChild;
  enter(t);
  setTimeout(() => leave(t).finished.then(() => layer.remove(), () => layer.remove()), 1800);
}

/* --- Share: "Send this moment to someone you know" (bottom sheet) --- */
// What gets sent is exactly the entry's text, followed by who and where it's from.
function shareParts(e) {
  const byline = e.own ? [myName(), e.place].filter(Boolean) : [attribution(e)];
  return { text: e.text || cardLine(e), byline };
}
const shareMessage = e => { const p = shareParts(e); return `${p.text}\n\n— ${p.byline.join(" · ")}`; };
const momentLink = e => `${location.origin}${location.pathname}#moment/${e.id}`;

function shareMoment(id) {
  const e = findEntry(id);
  if (!e) return;
  const { text, byline } = shareParts(e);
  const msg = encodeURIComponent(shareMessage(e));
  Sheet.open({
    title: "Send this moment to someone you know",
    closeLabel: "Close",
    body: `<div class="share-body">
      <div class="share-preview">
        <p class="share-text">${esc(text)}</p>
        <p class="share-by">${byline.map(esc).join('<span class="moment-dot" aria-hidden="true"></span>')}</p>
      </div>
      <div class="share-options">
        <a class="share-option" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener" data-action="share-done">${ICONS.whatsapp}<span>WhatsApp</span></a>
        <a class="share-option" href="sms:&body=${msg}" data-action="share-done">${ICONS.message}<span>Message</span></a>
        <button class="share-option" data-action="share-link" data-value="${e.id}">${ICONS.link}<span>Link</span></button>
      </div>
    </div>`,
    returnFocus: () => document.querySelector('[data-action="share"]'),
  });
}

async function copyMomentLink(id) {
  const e = findEntry(id);
  Sheet.close();
  try { await navigator.clipboard.writeText(momentLink(e)); toast("Link copied"); }
  catch (_) { toast("Couldn't copy the link"); }
}

function toggleBookmark(id) {
  const k = String(id);
  state.bookmarks.has(k) ? state.bookmarks.delete(k) : state.bookmarks.add(k);
  $("bookmark-btn").outerHTML = bookmarkBtn(id);
  toast(state.bookmarks.has(k) ? "Bookmarked" : "Bookmark removed");
}

// ⋮ opens the reusable bottom sheet with more options
/* ============ Filters (personal timeline, day view) ============ */
const WITH_OPTIONS = [["audio", "Recording"], ["photo", "Photo"], ["place", "Location"]];
const VIS_OPTIONS = [["private", "Private Only"], ["public", "Shared Publicly"]];

function applyFilters(list) {
  const f = state.filters;
  return list.filter(e =>
    (f.chapters.size === 0 || f.chapters.has(e.chapter)) &&
    [...f.with].every(k => k === "audio" ? !!e.audioDuration : !!e[k]) &&
    (!f.visibility || (f.visibility === "public" ? !!e.public : !e.public)));
}
function filterCount() {
  const f = state.filters;
  return f.chapters.size + f.with.size + (f.visibility ? 1 : 0) + (f.predictions ? 1 : 0);
}

function filterBodyHTML() {
  const f = state.filters;
  const chapters = [...new Set(state.entries.map(e => e.chapter).filter(Boolean))].sort();
  const chip = (action, value, label, on) => `<button data-action="${action}" data-value="${esc(value)}" aria-pressed="${on}">${esc(label)}</button>`;
  const n = filterCount();
  return `
    <div class="filter-group">
      <h3 class="filter-label">Chapter</h3>
      ${chapters.length
        ? `<div class="filter-chips">${chapters.map(c => chip("filter-chapter", c, c, f.chapters.has(c))).join("")}</div>`
        : `<p class="filter-none">No chapter created</p>`}
    </div>
    <div class="filter-group">
      <h3 class="filter-label">Entries with</h3>
      <div class="filter-chips">${WITH_OPTIONS.map(([k, l]) => chip("filter-with", k, l, f.with.has(k))).join("")}</div>
    </div>
    <div class="filter-group">
      <h3 class="filter-label">Visibility</h3>
      <div class="filter-chips">${VIS_OPTIONS.map(([k, l]) => chip("filter-vis", k, l, f.visibility === k)).join("")}</div>
    </div>
    <div class="filter-row">
      <h3 class="filter-label" id="pred-label">Include predictions</h3>
      <button class="switch" role="switch" aria-checked="${f.predictions}" aria-labelledby="pred-label" data-action="filter-predictions">
        <span class="switch-track"><span class="switch-knob"></span></span>
      </button>
    </div>
    <div class="filter-foot">
      <button class="link" data-action="filters-clear">Clear All</button>
      <span class="filter-count" role="status">${n} ${n === 1 ? "filter" : "filters"} applied</span>
    </div>`;
}

function openFilters() {
  Sheet.open({
    title: "Filters",
    closeLabel: "Close",
    body: `<div class="filter-body" id="filter-body">${filterBodyHTML()}</div>`,
    returnFocus: () => document.querySelector('[data-action="open-filters"]'),
  });
}

// Filters apply live: the timeline behind the sheet updates as you tap
function updateFilters(focusAction, focusValue) {
  const body = $("filter-body");
  if (body && focusAction === "filter-predictions") {
    // Update the switch in place so its knob slides; just refresh the count
    body.querySelector('[data-action="filter-predictions"]').setAttribute("aria-checked", state.filters.predictions);
    const n = filterCount();
    body.querySelector(".filter-count").textContent = `${n} ${n === 1 ? "filter" : "filters"} applied`;
  } else if (body) {
    body.innerHTML = filterBodyHTML();
    const sel = `[data-action="${focusAction}"]${focusValue != null ? `[data-value="${CSS.escape(focusValue)}"]` : ""}`;
    body.querySelector(sel)?.focus({ preventScroll: true });
  }
  render();
}

function openMomentMore(id) {
  const e = findEntry(id);
  if (!e) return;
  Sheet.open({
    title: "Moment",
    body: `<div class="sheet-options" id="more-options">
      <button data-action="copy-text" data-value="${e.id}">${ICONS.copy}<span>Copy text</span></button>
      ${e.own ? `<button class="danger" data-action="delete-ask" data-value="${e.id}" data-key="delete">${ICONS.trash}<span>Delete moment</span></button>` : ""}
    </div>`,
    returnFocus: () => document.querySelector('[data-action="moment-more"]'),
  });
}

function askDelete(id) {
  // Swap the option in place for an explicit confirmation
  const opt = document.querySelector('[data-action="delete-ask"]');
  const confirm = fromHTML(`<button class="danger" data-action="delete-confirm" data-value="${id}">${ICONS.trash}<span>Delete — this can't be undone</span></button>`, "confirm");
  opt.replaceWith(confirm);
  enter(confirm);
  confirm.focus();
}

function deleteMoment(id) {
  state.entries = state.entries.filter(x => String(x.id) !== String(id));
  state.bookmarks.delete(String(id));
  Sheet.close(true);
  location.hash = "#timeline";
  setTimeout(() => toast("Moment deleted"), 50);
}

/* ============ Router ============ */
const TAB_ROUTES = TABS.map(t => t.route);
let currentRoute = null, previousRoute = null;

// Routes can carry a parameter: "#moment/3" → name "moment", param "3"
const routeName = r => (r || "").split("/")[0];
// Tabs sit at depth 0; capture and anything opened from a screen sit at depth 1.
// The name screen sits at depth 0 too, so leaving it fades into the timeline rather than sliding.
const depthOf = r => routeName(r) === "welcome" ? 0 : (routeName(r) === "capture" || !TAB_ROUTES.includes(routeName(r))) ? 1 : 0;
let screenAnims = [];
const scrollMemory = {};

/* render(mode): mode is "forward" | "back" | "fade" (tab switch) | undefined (same screen, no animation).
   Each screen is a .layer in the #stage grid; during a transition the old and new layers overlap. */
function render(mode) {
  const route = location.hash.slice(1) || "timeline";
  const stage = $("stage");

  // Settle any transition still running
  screenAnims.forEach(a => a.finish());
  screenAnims = [];
  stage.querySelectorAll(".layer.leaving").forEach(l => l.remove());

  const old = stage.querySelector(".layer");
  const scrollY = window.scrollY;
  const [name, ...params] = route.split("/");
  const view = screens[name] ? screens[name](...params) : placeholder(name);
  const layer = document.createElement("div");
  layer.className = "layer";
  layer.innerHTML = `
    <main id="screen" class="screen" tabindex="-1">${view.html}</main>
    <div class="dock">
      <div id="dock-actions" class="dock-actions">${view.actions || ""}</div>
      <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
    </div>`;

  const animated = old && (mode === "forward" || mode === "back");
  if (animated) {
    old.classList.add("leaving");
    old.inert = true;
    old.setAttribute("aria-hidden", "true");
    old.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
  } else if (old) {
    old.remove();
  }
  // Back: the new screen sits underneath while the old one slides away
  if (animated && mode === "back") stage.insertBefore(layer, old); else stage.appendChild(layer);

  renderTabbar(TAB_ROUTES.includes(name) ? name : "timeline", view.hideTabbar);
  // New screens start at the top; going back returns to where you were (e.g. deep in the month scroll)
  let newScroll = scrollY;
  if (route !== currentRoute) {
    if (currentRoute) scrollMemory[currentRoute] = scrollY;
    newScroll = mode === "back" ? (scrollMemory[route] || 0) : 0;
    window.scrollTo(0, newScroll);
    // Switching view within the same screen (e.g. a day as Public → Yours) keeps the screen you came from
    if (routeName(route) !== routeName(currentRoute)) previousRoute = currentRoute;
    currentRoute = route;
  }
  view.mount && view.mount();
  if (newScroll && window.scrollY !== newScroll) window.scrollTo(0, newScroll);

  if (animated) {
    // Keep the old screen where it was on the page while the page scroll changes under it
    const shift = newScroll - scrollY;
    const hold = shift ? ` translateY(${shift}px)` : "";
    let anim;
    if (mode === "forward") {
      if (hold) old.style.transform = hold.trim();
      layer.classList.add("moving");
      anim = motion(layer, [{ transform: "translateX(100%)" }, { transform: "translateX(0)" }],
        { duration: 280, easing: EASE_OUT }, [{ opacity: 0 }, { opacity: 1 }]);
    } else {
      old.classList.add("moving");
      anim = motion(old, [{ transform: `translateX(0)${hold}` }, { transform: `translateX(100%)${hold}` }],
        { duration: 240, easing: EASE_IN, fill: "forwards" }, [{ opacity: 1 }, { opacity: 0 }]);
    }
    screenAnims.push(anim);
    const done = () => { old.remove(); layer.classList.remove("moving"); };
    anim.finished.then(done, done);
  } else if (mode === "fade") {
    enter(layer);
  }
}

window.addEventListener("hashchange", () => {
  stopRecording();
  stopPlayback();
  Sheet.close(true);
  state.menuOpen = null;
  const next = location.hash.slice(1) || "timeline";
  const from = depthOf(currentRoute), to = depthOf(next);
  render(currentRoute === null || next === currentRoute ? undefined : to > from ? "forward" : to < from ? "back" : "fade");
});

// Chapter name field: Enter confirms, Escape cancels
document.addEventListener("input", e => { if (e.target.id === "chapter-name") state.capture.chapterInput = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.id !== "chapter-name") return;
  if (e.key === "Enter") { e.preventDefault(); confirmChapter(); }
  if (e.key === "Escape") cancelChapter();
});
// Lets :active (button press) fire on iOS Safari
document.addEventListener("touchstart", () => {}, { passive: true });

/* ============ Actions ============ */
const ACTIONS = {
  // timeline
  "scope":        v => {
    state.scope = v;
    // A day opened as Public from "View full timeline": choosing a view here drops that override
    const [name, key, forced] = (currentRoute || "").split("/");
    if (name === "day" && forced) location.replace(`#day/${key}`);
    else render();
  },
  "toggle-menu":  v => {
    state.menuOpen = state.menuOpen === v ? null : v;
    render();
    const menu = document.querySelector(".menu:not([hidden])");
    if (menu) enter(menu);
  },
  "viewby":       v => { state.viewBy = v; state.menuOpen = null; render(); },
  "open-moment":  v => { location.hash = `#moment/${v}`; },
  "open-day":     v => { location.hash = `#day/${v}`; },    // keeps the Yours / Public / Both setting
  // filters
  "name-skip":      () => setName("You"),
  "open-filters":   () => openFilters(),
  "filter-chapter": v => { const s = state.filters.chapters; s.has(v) ? s.delete(v) : s.add(v); updateFilters("filter-chapter", v); },
  "filter-with":    v => { const s = state.filters.with; s.has(v) ? s.delete(v) : s.add(v); updateFilters("filter-with", v); },
  "filter-vis":     v => { state.filters.visibility = state.filters.visibility === v ? null : v; updateFilters("filter-vis", v); },
  "filter-predictions": () => { state.filters.predictions = !state.filters.predictions; updateFilters("filter-predictions"); },
  // chapter view
  "chapter-exit":   () => { state.filters.chapters.clear(); updateFilters("open-filters"); },
  "chapter-close":  v => {
    if (state.closedChapters[v]) delete state.closedChapters[v]; else state.closedChapters[v] = new Date();
    render();
    toast(state.closedChapters[v] ? "Chapter closed" : "Chapter reopened");
  },
  "filters-clear":  () => {
    const f = state.filters; f.chapters.clear(); f.with.clear(); f.visibility = null; f.predictions = false;
    updateFilters("filters-clear");
  },
  "play":         v => togglePlay(v),
  // moment view
  "share":        v => shareMoment(v),
  "share-link":   v => copyMomentLink(v),
  "share-done":   () => setTimeout(() => Sheet.close(), 300),   // let the link open WhatsApp/Messages, then tidy up
  "bookmark":     v => toggleBookmark(v),
  "card-bookmark": v => {
    const k = String(v);
    state.bookmarks.has(k) ? state.bookmarks.delete(k) : state.bookmarks.add(k);
    $(`card-bm-${v}`).outerHTML = cardBookmark(v);
    $(`card-bm-${v}`).focus({ preventScroll: true });
    toast(state.bookmarks.has(k) ? "Bookmarked" : "Bookmark removed");
  },
  "moment-more":  v => openMomentMore(v),
  "copy-text":    v => { const e = findEntry(v); Sheet.close(); navigator.clipboard?.writeText(e?.text || "").then(() => toast("Text copied"), () => toast("Couldn't copy")); },
  "delete-ask":   v => askDelete(v),
  "delete-confirm": v => deleteMoment(v),
  // capture
  "back":         () => { location.hash = "#" + (previousRoute && previousRoute !== "capture" ? previousRoute : "timeline"); },
  "change-prompt":() => { const c = state.capture; c.promptIndex = (c.promptIndex + 1) % PROMPTS.length; $("prompt").textContent = PROMPTS[c.promptIndex]; },
  "mic":          () => startRecording(),
  "stop":         () => stopRecording(),
  "place":        () => openPlaceSheet(),
  "pick-place":   v => pickPlace(v),
  "remove-photo": () => { URL.revokeObjectURL(state.draft.photo); state.draft.photo = null; renderAttachments(); renderTools(); },
  "remove-place": () => { state.draft.place = null; renderAttachments(); renderTools(); },
  "remove-audio": () => { state.draft.audioDuration = null; state.draft.audio = []; state.draft.audioClipSecs = []; renderAttachments(); renderTools(); },  // words stay
  "chapter-start":   () => startChapter(),
  "chapter-confirm": () => confirmChapter(),
  "chapter-cancel":  () => cancelChapter(),
  "chapter-remove":  () => { state.draft.chapter = null; renderChapter(); $("chapter-add").focus(); },
  "toggle-public":   () => { state.draft.public = !state.draft.public; renderPublic(); },
  "anonymous":    v => { state.draft.anonymous = v === "true"; renderPublic(); },
  "add-moment":   () => addMoment(),
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (state.menuOpen && !e.target.closest(".menu") && !(el && el.dataset.action === "toggle-menu")) {
    state.menuOpen = null;
    if (!el) { render(); return; }
  }
  if (!el || el.disabled) return;
  ACTIONS[el.dataset.action]?.(el.dataset.value, el);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.menuOpen) { state.menuOpen = null; render(); }
});

// Every load starts on the name screen
state.name = null;
history.replaceState(null, "", location.pathname + location.search + "#welcome");
render();
</script>
</body>
</html>
