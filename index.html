<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>The Year We Were</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --page: #FFFFFF;
  --card: #F4F2DA;          /* entry cards, prompt cards, toggle track, inputs */
  --surface-strong: #E8E4BA;/* audio player bar, active tab pill, chips */
  --line: #DCDAD4;          /* dividers, input borders, outlined buttons */
  --accent-line: #D8D296;   /* border on prompt + opened-prediction cards */
  --ink: #1C1B19;           /* text, dark buttons */
  --ink-2: #55524C;         /* secondary text */
  --meta: #8C877F;          /* dates, counts, attribution */
  --accent: #66602F;        /* opened, active */
  --record: #BF2E53;        /* recording stop button only */

  --shadow-card: 0 1px 2px rgba(28,27,25,0.05), 0 2px 8px rgba(28,27,25,0.04);
  --shadow-raised: 0 1px 2px rgba(36,31,26,0.06);   /* Figma "elevation-1 · Raised": entry cards, month cells */
  --shadow-pill: 0 1px 3px rgba(28,27,25,0.08), 0 4px 12px rgba(28,27,25,0.06);

  --serif: "Source Serif 4", Georgia, serif;
  --sans: "Source Sans 3", "Source Sans Pro", -apple-system, system-ui, sans-serif;

  --r-card: 10px;
  --r-pill: 999px;
  --tap: 44px;
  --gutter: 24px;
  --max-w: 430px;
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
svg { display: block; flex-shrink: 0; }
[hidden] { display: none !important; }
.serif { font-family: var(--serif); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ App frame ============ */
.app { max-width: var(--max-w); margin: 0 auto; }
/* Screens stack in one grid cell so two can overlap during a transition — no absolute positioning */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); overflow-x: hidden; overflow-x: clip; }
.layer {
  grid-area: 1 / 1;
  min-width: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  background: var(--page);
}
.layer.moving { box-shadow: -12px 0 32px rgba(28,27,25,0.10); }
.screen { flex: 1; display: flex; flex-direction: column; }

/* Dock: sticks to the bottom, holds per-screen floating actions + the tab bar */
.dock { position: sticky; bottom: 0; z-index: 10; pointer-events: none; }
.dock > * { pointer-events: auto; }
/* Floating actions overlap the end of the content (negative margin, not positioning)
   so the screen's content — like the timeline spine — runs down to the tab bar */
.dock-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  height: 64px;
  margin-top: -64px;
  padding: 0 var(--gutter) 16px;
  pointer-events: none;
}
.dock-actions > * { pointer-events: auto; }
.dock-actions:empty { display: none; }

/* ============ Tab bar ============ */
.tabbar {
  background: var(--page);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1 1 0;
  min-width: var(--tap);
  min-height: var(--tap);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 12px;
  font-weight: 600;
}
.tab-icon { display: flex; align-items: center; justify-content: center; padding: 6px 12px; border-radius: var(--r-pill); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .tab-icon { background: var(--surface-strong); }
.tab-add { flex: 1 1 0; display: flex; justify-content: center; }
.tab-add .btn-dark { width: 56px; height: 56px; }

/* ============ Buttons ============ */
.btn-dark, .btn-white {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: var(--tap);
  min-height: var(--tap);
  border-radius: var(--r-pill);
  font-size: 14px;
  line-height: 15px;
  font-weight: 600;
}
/* Button press: 100ms scale(0.97). Disabled fades by opacity. */
button, .btn-dark, .btn-white, .tab { transition: transform 100ms ease-out, opacity 180ms ease; }
:is(button, .btn-dark, .btn-white, .tab):active:not(:disabled) { transform: scale(0.97); }
.btn-dark { background: var(--ink); color: #FFFFFF; box-shadow: var(--shadow-pill); }
.btn-white { background: var(--page); color: var(--ink); box-shadow: var(--shadow-pill); }
.btn-round { width: 48px; height: 48px; padding: 0; }
.btn-pill { height: 48px; padding: 8px 12px 8px 16px; }
.btn-chip { padding: 0 14px 0 12px; }
.btn-block { width: 100%; min-height: 70px; font-size: 20px; line-height: 18px; box-shadow: none; }
.btn-dark:disabled { opacity: 0.35; cursor: not-allowed; }
.link { min-height: var(--tap); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }

/* ============ Header ============ */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px var(--gutter) 16px; }
.wordmark { font-size: 24px; line-height: 28px; }

/* Segmented toggle */
.segment-wrap { display: flex; justify-content: center; padding: 4px var(--gutter) 8px; }
.segment { display: flex; gap: clamp(4px, 8vw - 14px, 16px); padding: 4px; background: var(--card); border-radius: var(--r-pill); }
.segment button {
  min-width: 87px; min-height: var(--tap); padding: 8px 12px;
  border-radius: var(--r-pill); font-size: 16px; line-height: 18px; font-weight: 600;
}
.segment button[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; box-shadow: var(--shadow-pill); }

/* Title row */
.title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 24px var(--gutter) 20px; }
.title-block { display: flex; flex-direction: column; gap: 12px; }
.h2 { font-size: 32px; line-height: 36px; }
.viewby { display: flex; align-items: center; gap: 8px; }
.viewby-label { font-size: 14px; line-height: 15px; font-weight: 600; color: var(--ink-2); }

/* In-place menu (∨) */
.menu-anchor { position: relative; }
.menu {
  position: absolute; /* popover only — anchored to its trigger */
  top: calc(100% + 6px); left: 0; z-index: 20;
  min-width: 140px; padding: 6px;
  background: var(--page); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-pill);
  display: flex; flex-direction: column;
}
.menu button {
  min-height: var(--tap); padding: 0 12px; border-radius: 8px; text-align: left;
  font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
}
.menu button[aria-checked="true"] { color: var(--accent); background: var(--card); }
.chev { transition: transform 180ms ease; }
[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ============ Timeline ============ */
.empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 40px var(--gutter) 88px;   /* sits a little above centre, well clear of the filter button */ text-align: center; color: var(--ink-2);
}
.empty-art { width: 203px; max-width: 56%; height: auto; margin-bottom: 12px; }
.empty-title { font-size: 24px; line-height: 28px; }
.empty-body { font-size: 18px; line-height: 24px; font-weight: 600; max-width: 250px; }

/* Timeline: date column | spine | cards. The spine spans every row of the grid. */
.tl {
  flex: 1;
  display: grid;
  grid-template-columns: 50px 10px minmax(0, 1fr);
  column-gap: 12px;
  row-gap: 8px;
  padding: 8px var(--gutter) 0;
}
/* Leaves room so the last card can scroll clear of the filter button */
.tl::after { content: ""; grid-column: 3; height: 72px; }
.tl-spine { grid-column: 2; grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center; transform-origin: bottom; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); flex-shrink: 0; }
.tl-line { flex: 1; width: 2px; background: var(--ink); }
.tl-date { grid-column: 1; align-self: center; text-align: right; white-space: nowrap; font-size: 16px; line-height: 18px; font-weight: 600; color: var(--ink-2); }
.tl-cell { grid-column: 3; min-width: 0; }

/* ===== Month view: one continuous scroll of months, newest first ===== */
.months { padding: 8px var(--gutter) 0; }
.months::after { content: ""; display: block; height: 72px; }   /* clear of the filter button */
.month { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; }
/* Rail: the spine runs down every month's rail, so it reads as one line */
.month-rail { display: flex; flex-direction: column; align-items: center; background: linear-gradient(var(--ink), var(--ink)) center / 2px 100% no-repeat; }
.month:first-child .month-rail::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); flex-shrink: 0; }
/* The month label sticks to the left edge while its grid passes */
.month-label {
  position: sticky; top: calc(12px + env(safe-area-inset-top));
  margin: 0; padding: 8px 4px; border-radius: 4px;
  background: var(--ink-2); color: #FFFFFF;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 15px; line-height: 18px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
}
.month-body { display: flex; flex-direction: column; gap: 4px; padding: 4px 0 40px; min-width: 0; }
.grid-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 18px; }
.grid-title { font-size: 16px; line-height: 18px; color: var(--ink); }
.grid-count { margin-left: auto; font-size: 14px; line-height: 15px; font-weight: 600; color: var(--ink-2); }
.weekdays, .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.weekdays { font-family: var(--serif); font-weight: 600; font-size: 18px; line-height: 20px; color: var(--ink-2); text-align: center; padding-top: 4px; }
.cell {
  height: 63px; padding: 4px; border-radius: 4px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  background: var(--heat-bg); color: var(--heat-fg); text-align: left;
  box-shadow: var(--shadow-raised);
}
.cell-date { font-family: var(--serif); font-weight: 600; font-size: 16px; line-height: 18px; }
.cell-count { font-size: 11px; line-height: 12px; font-weight: 600; }
.cell.outside { background: #FEFFF8; box-shadow: none; }   /* flat: not part of the month */
.cell.texture { height: 22px; padding: 0; }         /* public grid in Both: a texture, no numbers */
.grid-gap { height: 16px; }
.legend { display: flex; align-items: center; gap: 6px; padding-top: 4px; font-size: 11px; line-height: 12px; font-weight: 600; color: var(--ink-2); }
.legend-swatches { display: flex; gap: 2px; }
.legend-swatches i { width: 21px; height: 10px; border-radius: var(--r-pill); background: var(--sw); }

/* Day screen (opened from a month cell) */
.day-head { display: flex; align-items: center; gap: 16px; padding: 16px var(--gutter) 8px; }
.day-title { font-size: 24px; line-height: 28px; }
.day-summary { padding: 8px var(--gutter) 4px; font-size: 14px; line-height: 18px; font-weight: 600; color: var(--ink-2); }
.day-empty { padding: 24px var(--gutter); color: var(--meta); font-size: 16px; }

/* ===== Both — day view: one sideways timeline. Each day is a column; the line runs through them all. ===== */
.band {
  overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
  scroll-snap-type: x mandatory; scroll-padding-left: 16px;
  scrollbar-width: none;
  padding: 8px 0 88px;                                   /* bottom: clear of the filter button */
}
.band::-webkit-scrollbar { display: none; }
.band-grid {
  display: grid;
  grid-template-rows: auto auto auto auto auto;         /* heading · your cards · line · heading · public cards */
  grid-auto-columns: max-content;
  width: max-content;
  padding-left: 16px;
}
/* Every cell in a day leaves room before the next day; the line cell doesn't, so the line never breaks */
.bc { padding-right: 32px; min-width: 0; }
.bc-head { padding-top: 4px; padding-bottom: 12px; }
.bc-head:nth-child(5n + 4) { padding-top: 14px; }       /* "Similar moments" sits a little below the line */
.bc-row { display: flex; align-items: stretch; gap: 10px; }
/* Headings and the date stay pinned to the left edge while their day passes, then get pushed off */
.stick { position: sticky; left: 16px; display: inline-block; max-width: calc(100vw - 32px); }
.both-title { font-size: 24px; line-height: 28px; color: var(--ink); white-space: nowrap; }
.both-title small { font-size: 16px; line-height: 18px; }
.both-sub { font-size: 14px; line-height: 17px; font-weight: 600; color: var(--ink-2); max-width: 300px; padding-top: 4px; }
.both-none { flex: 0 0 270px; align-self: center; font-size: 14px; line-height: 18px; color: var(--meta); padding: 12px 0; }
/* Fixed 270px cards so the next one peeks in, snapping to each card's start */
.bc-row > .entry-card { flex: 0 0 270px; scroll-snap-align: start; }
.bc-row .card-title { -webkit-line-clamp: 3; }
.bc-row .card-meta { margin-top: auto; }
/* The last item in the public row is an action, not content: the dark "View Full Timeline" pill
   (Figma Primary Button), centred against the cards */
.bc-row > .view-full {
  flex: 0 0 auto; align-self: center; scroll-snap-align: start;
  min-height: var(--tap); padding: 12px 18px;
  font-size: 16px; line-height: 18px; white-space: nowrap; box-shadow: none;
}
/* The timeline line, horizontal: drawn through every day's line cell edge to edge */
.bc-line { display: flex; align-items: center; padding: 14px 32px 0 0;   /* end spacing like the other cells: the line (a background) still runs through it, and the date gets fully pushed off as its day ends */ background: linear-gradient(var(--ink), var(--ink)) 0 calc(50% + 7px) / 100% 2px no-repeat; }
.bc-line.first::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); flex-shrink: 0; margin-right: 18px; }
.dm-label { padding: 4px 6px; border-radius: 4px; background: var(--ink-2); color: #FFFFFF; font-size: 16px; line-height: 20px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.bc-line .dm-label.stick { left: 16px; }

/* Entry card: renders whatever the entry has. Bounded height: chip, 2-line text, fixed photo, one-row audio, meta. */
.entry-card {
  background: var(--card); border-radius: 4px; box-shadow: var(--shadow-raised);
  padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  cursor: pointer; overflow: hidden;
}
.card-chapter { padding: 4px 8px; border-radius: var(--r-pill); background: var(--page); border: 1px solid var(--accent); font-size: 11px; line-height: 12px; font-weight: 600; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head { width: 100%; display: flex; align-items: flex-start; gap: 8px; }
.card-title {
  flex: 1; min-width: 0; font-size: 14px; line-height: 17px; font-weight: 600; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
}
.card-go { color: var(--ink); margin-top: -4px; }
.card-photo { width: 100%; height: 45px; border-radius: 2px; background: var(--surface-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.card-audio { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 0; border-radius: 2px; background: var(--surface-strong); color: var(--ink); }
.card-bookmark { width: var(--tap); height: var(--tap); margin: -10px 0 -12px -10px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.card-bookmark[aria-pressed="true"] { color: var(--accent); }
.card-shared { display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 12px; font-weight: 600; color: var(--ink-2); }
.card-play { width: var(--tap); height: var(--tap); margin: -5px -10px -5px -4px; display: flex; align-items: center; justify-content: center; }
.wave { display: flex; align-items: center; gap: 2px; height: 26px; }
.wave i { width: 4px; border-radius: var(--r-pill); background: var(--accent); }
.card-dur { font-size: 14px; line-height: 15px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 28px; }
.card-meta { font-size: 11px; line-height: 12px; font-weight: 600; color: var(--ink-2); }

/* ============ Capture ============ */
.capture {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 32px;
  padding: 8px var(--gutter) calc(24px + env(safe-area-inset-bottom));
}
.capture-main { display: flex; flex-direction: column; gap: 16px; }
.capture-nav { display: flex; align-items: center; justify-content: space-between; }
.capture-date { font-size: 14px; line-height: 15px; font-weight: 600; }
.prompt { display: flex; flex-direction: column; gap: 4px; }
.prompt .h2 { max-width: 320px; }

/* Composer: text → attachments → buttons */
.composer {
  min-height: 202px;
  display: flex; flex-direction: column;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  padding: 8px;
  background: var(--page);
}
.composer-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
.composer-text {
  display: block; width: 100%; min-height: 72px;
  border: 0; padding: 0; margin: 0; resize: none; overflow: hidden; background: transparent;
  font-size: 16px; line-height: 20px; font-weight: 600; color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.composer-text:focus { outline: none; }
.composer-text::placeholder { color: var(--ink-2); opacity: 1; }
.interim { color: var(--meta); }
.caret { display: inline-block; width: 1.5px; height: 1.1em; margin-left: 1px; vertical-align: text-bottom; background: var(--ink); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.composer-tools { border-top: 1px solid var(--line); padding-top: 8px; display: flex; align-items: center; min-height: 56px; }
.tools-row { display: flex; align-items: center; gap: 8px; }
.rec-row { flex: 1; display: flex; align-items: center; justify-content: space-between; }

/* Attachments row */
.attachments { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
/* Photo: 48px tile, badge overlaps its top-right corner by 12px (54px total width) */
.thumb { display: flex; align-items: flex-start; }
.thumb-tile { width: 48px; height: 48px; border-radius: 4px; background: var(--surface-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; }
/* 44px hit area; the 18px circle sits at its centre, negative margins place it on the corner */
.thumb-x { width: var(--tap); height: var(--tap); margin: -13px -13px -13px -25px; display: flex; align-items: center; justify-content: center; }
.thumb-x span { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: var(--tap);
  padding-left: 8px; border-radius: var(--r-pill);
  background: var(--surface-strong); color: var(--ink-2);
  font-size: 14px; line-height: 15px; font-weight: 600;
}
.chip-x { width: 36px; height: var(--tap); display: flex; align-items: center; justify-content: center; }
.chip-x span { width: 24px; height: 24px; border-radius: 50%; background: var(--page); color: var(--ink); display: flex; align-items: center; justify-content: center; }

/* Recording */
.rec-left { display: flex; align-items: center; gap: 16px; }
.btn-stop { width: 48px; height: 48px; border-radius: var(--r-pill); background: var(--record); box-shadow: var(--shadow-pill); display: flex; align-items: center; justify-content: center; }
.btn-stop span { width: 13px; height: 13px; background: #FFFFFF; border-radius: 1px; }
.meter { display: flex; align-items: center; gap: 2px; height: 26px; }
.meter i { width: 4px; height: 26px; border-radius: var(--r-pill); background: var(--meta); transform-origin: center; transition: transform .12s ease; }
.rec-time { font-size: 16px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Form groups */
.group { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.group-label { font-size: 18px; line-height: 22px; font-weight: 600; }

/* Chapter */
.chapter-pill { display: inline-flex; align-items: center; gap: 4px; min-height: var(--tap); padding-left: 12px; border-radius: var(--r-pill); background: var(--surface-strong); color: var(--ink-2); font-size: 14px; font-weight: 600; }
.chapter-edit { display: flex; align-items: flex-end; gap: 12px; width: 100%; }
.text-field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.text-field label { font-size: 14px; line-height: 15px; font-weight: 600; padding-left: 2px; }
.text-field input {
  width: 100%; height: 56px; padding: 0 12px;
  background: var(--card); border: 2px solid var(--line); border-radius: 8px;
  font-size: 16px; font-weight: 600;
}
.text-field input:focus { outline: none; border-color: var(--ink); }
.chapter-actions { display: flex; gap: 8px; padding-bottom: 4px; }

/* Switch */
.switch { min-width: var(--tap); min-height: var(--tap); display: inline-flex; align-items: center; }
/* Colour changes are cross-fades of stacked layers (opacity), knob moves by transform */
.switch-track { width: 40px; height: 24px; border-radius: var(--r-pill); background: var(--ink); padding: 3px; display: grid; }
.switch-track::before { content: ""; grid-area: 1 / 1; margin: -3px; border-radius: inherit; background: var(--surface-strong); opacity: 0; transition: opacity 180ms ease; }
.switch-knob { grid-area: 1 / 1; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; display: grid; transition: transform 180ms cubic-bezier(0.32,0.72,0,1); }
.switch-knob::after { content: ""; border-radius: 50%; background: var(--ink); opacity: 0; transition: opacity 180ms ease; }
.switch[aria-checked="true"] .switch-track::before,
.switch[aria-checked="true"] .switch-knob::after { opacity: 1; }
.switch[aria-checked="true"] .switch-knob { transform: translateX(16px); }

.choice { display: flex; gap: 6px; }
.choice button {
  min-height: var(--tap); padding: 0 14px; border-radius: var(--r-pill);
  border: 1.5px solid var(--line); background: var(--page);
  font-size: 14px; font-weight: 600;
}
.choice button[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }

/* ============ Bottom sheet (reusable) ============ */
.sheet-layer {
  position: fixed; inset: 0; z-index: 100;        /* overlay: the one place fixed positioning is right */
  display: grid; grid-template-columns: minmax(0, 1fr);
}
.sheet-scrim { grid-area: 1 / 1; background: rgba(28,27,25,0.5); }
.sheet {
  grid-area: 1 / 1; align-self: end; justify-self: center;
  width: 100%; max-width: var(--max-w);
  max-height: calc(100dvh - 48px);
  display: flex; flex-direction: column;
  background: var(--page);
  border-radius: 16px 16px 0 0;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet:focus { outline: none; }
.sheet-grab { padding: 12px 0 4px; display: flex; justify-content: center; cursor: grab; touch-action: none; }
.sheet-handle { width: 41px; height: 7px; border-radius: var(--r-pill); background: var(--line); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 4px var(--gutter); }
.sheet-title { font-size: 18px; line-height: 20px; }
.sheet-cancel { min-height: var(--tap); padding: 0 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px 0 24px; }

/* Place picker (sheet content) */
.place-current {
  width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px;
  padding: 8px var(--gutter); background: var(--card); text-align: left;
}
.place-current-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.place-current-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.place-name { font-size: 16px; line-height: 18px; font-weight: 600; color: var(--ink); }
.place-sub { font-size: 13px; line-height: 15px; font-weight: 600; color: var(--meta); }
.place-check { color: var(--accent); }
.search-field {
  margin: 16px var(--gutter) 20px; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--card); border: 2px solid var(--line); border-radius: 8px; color: var(--ink-2);
}
.search-field:focus-within { border-color: var(--ink); }
.search-field input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; font-weight: 600; color: var(--ink); -webkit-appearance: none; appearance: none; }
.search-field input:focus { outline: none; }
.search-field input::placeholder { color: var(--meta); }
.place-section { padding: 0 var(--gutter); }
.list-label { font-size: 11px; line-height: 12px; font-weight: 600; color: var(--ink-2); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.place-list li { border-bottom: 1px solid var(--line); }
.place-list button { width: 100%; min-height: var(--tap); display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.place-list button[aria-pressed="true"] { color: var(--ink); }
.place-empty { padding: 14px 0; font-size: 14px; color: var(--meta); }

/* ============ Full moment view ============ */
.moment-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px var(--gutter); }

.moment-chapter-label { font-size: 14px; line-height: 15px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.moment-chapter .btn-white { height: 48px; padding: 0 12px 0 14px; max-width: 180px; }
.moment-chapter .btn-white span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.moment-body { display: flex; flex-direction: column; gap: 16px; padding: 0 var(--gutter) 24px; }
.moment-card { min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: 16px 16px 32px; border-radius: 16px; background: var(--page); }
.moment-main { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.moment-date { font-size: 18px; line-height: 20px; color: var(--ink-2); }
.moment-text { font-size: 16px; line-height: 24px; font-weight: 400; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.moment-photo { width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; background: var(--surface-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 8px; }
.moment-photo img { width: 100%; height: 100%; object-fit: cover; }
.moment-main .card-audio { margin-top: 8px; }
.moment-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--ink-2); }
.moment-place { font-size: 14px; line-height: 15px; font-weight: 600; }
.moment-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-2); }
.moment-count { font-size: 13px; line-height: 15px; font-weight: 400; }
.moment-actions { display: flex; gap: 8px; padding-left: 1px; }
.moment-actions [aria-pressed="true"] { color: var(--accent); }

.filter-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 4px; }

.filter-count { font-size: 14px; line-height: 15px; font-weight: 600; color: var(--ink-2); }
/* Filter button shows how many filters are on */
.filter-btn { display: inline-grid; place-items: center; }
.filter-btn > * { grid-area: 1 / 1; }
.filter-badge { justify-self: end; align-self: start; margin: -4px -4px 0 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill); background: var(--ink); color: #FFFFFF; font-size: 11px; line-height: 18px; font-weight: 600; }

.chapter-head { display: flex; flex-direction: column; gap: 8px; padding: 16px var(--gutter); }
.chapter-nav { display: flex; align-items: center; justify-content: space-between; }
.chapter-title { font-size: 24px; line-height: 28px; color: var(--ink); overflow-wrap: anywhere; }
.chapter-sub { font-size: 16px; line-height: 18px; font-weight: 600; color: var(--ink); }

.sheet-options button:last-child { border-bottom: 0; }

/* Toast: brief confirmation (e.g. "Copied") */
.toast-layer { position: fixed; inset: auto 0 calc(96px + env(safe-area-inset-bottom)) 0; z-index: 120; display: flex; justify-content: center; pointer-events: none; }

.welcome-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; }

/* ============ Reduced motion: no transforms, opacity only at 120ms ============
   (Screen, sheet and in-place animations run through motion() in the script,
   which follows the same rule.) */
@media (prefers-reduced-motion: reduce) {
  button, .btn-dark, .btn-white, .tab { transition: opacity 120ms ease; }
  :is(button, .btn-dark, .btn-white, .tab):active:not(:disabled) { transform: none; }
  .chev, .switch-knob { transition: none; }
  .switch-track::before, .switch-knob::after { transition: opacity 120ms ease; }
  .meter i { transition: opacity 120ms ease; transform: none !important; }
}

/* ============ Motion ============
   Only transform and opacity are ever animated. will-change is set while an element moves
   and cleared after. With prefers-reduced-motion, transforms are dropped and everything
   becomes an opacity change at 120ms. */
const EASE_OUT = "cubic-bezier(0.32,0.72,0,1)";
const EASE_IN = "cubic-bezier(0.4,0,1,1)";

function motion(el, frames, { duration, easing = EASE_OUT, fill = "none", delay = 0 }, reducedFrames) {

    frames = reducedFrames || frames.map(({ transform, ...rest }) => rest);
    duration = 120;
    easing = "ease";

  const props = [...new Set(frames.flatMap(Object.keys))];
  el.style.willChange = props.join(", ");
  const anim = el.animate(frames, { duration, easing, fill, delay });
  const clear = () => { el.style.willChange = ""; };
  anim.finished.then(clear, clear);
  return anim;

// In-place change: 180ms fade + 4px lift

const leave = el => motion(el, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-4px)" }], { duration: 180, easing: EASE_IN, fill: "forwards" });

/* morph(container, [{ key, html }], { exit, instant })
   Keyed update of a container's children: new keys fade in, unchanged keys are left alone,
   changed content swaps without animation, missing keys are removed (fading out if `exit`). */
const htmlOf = new WeakMap();
function fromHTML(html, key) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  const el = t.content.firstElementChild;
  el.dataset.key = key;
  htmlOf.set(el, html);
  return el;

  const current = new Map();
  [...container.children].forEach(c => { if (!c.dataset.leaving) current.set(c.dataset.key, c); });
  let prev = null;
  for (const { key, html } of items) {
    let el = current.get(key);
    if (el) {
      current.delete(key);
      if (htmlOf.get(el) !== html) { const n = fromHTML(html, key); el.replaceWith(n); el = n; }
    } else {
      el = fromHTML(html, key);
      if (prev) prev.after(el); else container.prepend(el);
      if (!instant) enter(el);
    }
    prev = el;
  }
  const exits = [...current.values()].map(el => {
    if (!exit || instant) { el.remove(); return null; }
    el.dataset.leaving = "1";
    return leave(el).finished.catch(() => {}).then(() => el.remove());
  }).filter(Boolean);
  return Promise.all(exits);
}

   Only one sheet is open at a time; Sheet.close() closes it. */

  let current = null;

  function open({ title, body, onMount, onClose, returnFocus, closeLabel = "Cancel" }) {
    if (current) close(true);
    const layer = document.createElement("div");
    layer.className = "sheet-layer";
    layer.innerHTML = `
      <div class="sheet-scrim" data-sheet-close></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
        <div class="sheet-grab" aria-hidden="true"><span class="sheet-handle"></span></div>
        <header class="sheet-head">
          <h2 class="sheet-title serif" id="sheet-title">${esc(title)}</h2>
          <button class="sheet-cancel" data-sheet-close>${esc(closeLabel)}</button>
        </header>
        <div class="sheet-body">${body}</div>
      </section>`;
    document.body.appendChild(layer);
    const sheet = layer.querySelector(".sheet"), scrim = layer.querySelector(".sheet-scrim"), bodyEl = layer.querySelector(".sheet-body");
    current = { layer, sheet, scrim, onClose, returnFocus };

    document.querySelector(".app").inert = true;
    document.documentElement.style.overflow = "hidden";

    layer.addEventListener("click", e => { if (e.target.closest("[data-sheet-close]")) close(); });
    enableSwipe(sheet, bodyEl);
    onMount && onMount(bodyEl);

    // Sheet up 300ms, scrim fades in 200ms
    motion(scrim, [{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: "ease" });
    motion(sheet, [{ transform: "translateY(100%)" }, { transform: "translateY(0)" }], { duration: 300, easing: EASE_OUT },
      [{ opacity: 0 }, { opacity: 1 }]);
    sheet.focus({ preventScroll: true });
  }

  function close(immediate) {
    if (!current) return;
    const { layer, sheet, scrim, onClose, returnFocus } = current;
    current = null;
    document.querySelector(".app").inert = false;
    document.documentElement.style.overflow = "";
    if (immediate) layer.remove();
    else {
      // Start from wherever it is now (mid-open, or mid-drag)
      const fromT = getComputedStyle(sheet).transform, fromO = getComputedStyle(scrim).opacity;
      sheet.getAnimations().forEach(a => a.cancel());
      scrim.getAnimations().forEach(a => a.cancel());
      layer.style.pointerEvents = "none";
      const from = fromT === "none" ? "translateY(0)" : fromT;
      // Sheet down 240ms, scrim fades out 200ms
      const down = motion(sheet, [{ transform: from }, { transform: "translateY(100%)" }], { duration: 240, easing: EASE_IN, fill: "forwards" },
        [{ opacity: 1 }, { opacity: 0 }]);
      motion(scrim, [{ opacity: fromO }, { opacity: 0 }], { duration: 200, easing: "ease", fill: "forwards" });
      const done = () => layer.remove();
      down.finished.then(done, done);
    }
    onClose && onClose();
    const f = returnFocus && returnFocus();
    f && f.focus({ preventScroll: true });
  }

  // Swipe down to dismiss: from the handle anywhere, or from the content when it's scrolled to the top.
  function enableSwipe(sheet, bodyEl) {
    let startY = null, dy = 0, dragging = false, startT = 0;
    const begin = (y, fromGrab) => {
      if (!fromGrab && bodyEl.scrollTop > 0) return;
      startY = y; dy = 0; dragging = false; startT = Date.now();
    };
    const move = (y, e) => {
      if (startY === null) return;
      dy = y - startY;
      if (!dragging && dy > 8) dragging = true;
      if (!dragging) return;
      e.cancelable && e.preventDefault();
      if (!sheet.style.willChange) sheet.style.willChange = "transform";
      sheet.style.transform = `translateY(${Math.max(0, dy)}px)`;   // follows the finger
    };
    const end = () => {
      if (startY === null) return;
      startY = null;
      if (!dragging) return;
      sheet.style.willChange = "";
      const fast = dy / Math.max(1, Date.now() - startT) > 0.6;
      if (dy > 100 || (fast && dy > 30)) { close(); return; }
      // Not far enough: spring back up
      const from = sheet.style.transform;
      sheet.style.transform = "";
      motion(sheet, [{ transform: from }, { transform: "translateY(0)" }], { duration: 300, easing: EASE_OUT });
    };
    sheet.addEventListener("touchstart", e => begin(e.touches[0].clientY, !!e.target.closest(".sheet-grab, .sheet-head")), { passive: true });
    sheet.addEventListener("touchmove", e => move(e.touches[0].clientY, e), { passive: false });
    sheet.addEventListener("touchend", end);
    sheet.addEventListener("touchcancel", end);
    // Mouse drag on the handle, for testing on desktop
    const grab = sheet.querySelector(".sheet-grab");
    grab.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse") return;
      begin(e.clientY, true);
      const mm = ev => move(ev.clientY, ev);
      const mu = () => { end(); removeEventListener("pointermove", mm); removeEventListener("pointerup", mu); };
      addEventListener("pointermove", mm); addEventListener("pointerup", mu);
    });
  }

  document.addEventListener("keydown", e => { if (e.key === "Escape" && current) close(); });

  return { open, close, isOpen: () => !!current };
})();

const OTHERS = (() => {
  const now = new Date(), midnight = new Date(now); midnight.setHours(0, 0, 0, 0);
  const TODAY = 21;
  // Today's entries: from 06:30 (or earlier, if it's still early) up to a few minutes ago
  const start = Math.min(midnight.getTime() + 6.5 * 3600e3, now.getTime() - 3 * 3600e3);
  const end = now.getTime() - 4 * 60e3;
  // Uneven gaps between today's entries (some bunched, some long quiet stretches), oldest → newest
  const gaps = Array.from({ length: TODAY }, (_, i) => 0.25 + ((i * 53 + 7) % 17) / 6);
  const total = gaps.reduce((a, b) => a + b, 0);
  let acc = 0;
  const fractions = gaps.map(g => (acc += g) / total).reverse();   // newest first, to match the list order
  return PUBLIC_SEED.map(([text, author, place, extra = {}], i) => {
    let createdAt;
    if (i < TODAY) {
      createdAt = new Date(Math.max(midnight.getTime() + 60e3, start + (end - start) * fractions[i]));
    } else {
      const k = i - TODAY, n = PUBLIC_SEED.length - TODAY;
      const day = new Date(midnight); day.setDate(day.getDate() - (1 + Math.floor((k * 29) / n)));
      day.setHours(6 + ((k * 7) % 17), (k * 23) % 60);
      createdAt = day;
    }
    return { id: `p${i + 1}`, text, author, anonymous: !author, place: place || undefined, createdAt, public: true, ...extra };
  });
})();

const fmtClock = d => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtSpineDate = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
const WAVE = [13, 26, 13, 19, 13, 26, 8, 26, 19];

// The card's text line: the first sentence, or the first ~45 characters cut at a word, with an ellipsis.
function cardLine(e) {
  const t = (e.text || "").replace(/\s+/g, " ").trim();
  if (!t) return e.audioDuration ? "Voice note" : e.photo ? "Photo" : e.place ? `In ${e.place}` : "A moment";
  if (t.length <= 45) return t;   // short enough to show whole ("Burnt the rice again. He ate it anyway.")
  const sentence = (t.match(/^.*?[.!?](?=\s|$)/) || [t])[0];
  if (sentence.length <= 45) return sentence;
  const cut = t.slice(0, 45);
  return cut.slice(0, cut.lastIndexOf(" ") > 25 ? cut.lastIndexOf(" ") : 45).replace(/[\s,;:.!?-]+$/, "") + "…";
}

// Who a public entry is from: "Mei" / "Mei · Wexford", or "Someone" / "Someone in Wexford".
// Seeded public entries keep their own names; only your name comes from the name screen.
function attribution(e) {
  if (e.anonymous || !e.author) return e.place ? `Someone in ${e.place}` : "Someone";
  return [e.author, e.place].filter(Boolean).join(" · ");
}

// Meta line: your own → "15:00" / "15:00 · Wexford"; someone else's → their attribution.
// No date on the card — the date lives on the spine beside it.
function cardMeta(e) {
  if (e.own) return [fmtClock(e.createdAt), e.place].filter(Boolean).join(" · ");
  return attribution(e);
}

/* ============ Both — day view ============
   The page scrolls down through days; within a day, two rows scroll sideways:
   your moments, a date marker, then "Similar moments" from the public timeline. */
const PUBLIC_ROW_CAP = 18;
const posts = n => `${n} ${n === 1 ? "post" : "posts"}`;

/* ============ Relatedness ("Similar moments") ============
   Stand-in for what the real app would do with similarity models or what someone reads and searches.
   Public moments from the same day are ranked by how much they share with what you wrote:
     • the same words (strongest), • the same topics, • the same place,
   then, more weakly, the topics you tend to write about on other days (your "history").
   Anything with no overlap still shows, after the related ones, newest first. */
const TOPICS = {
  food:     "rice soup lunch dinner breakfast eat ate cook cooked cooking toast coffee tea toffee oven bread meal",
  weather:  "rain raining rained wet soaked cold freezing heating sun sunny wind fire frost umbrella storm",
  commute:  "bus train cycle cycled cycling car walk walked walking commute station canal drive drove traffic",
  family:   "mam mum mother dad father daughter son sister brother nan grandad granny baby kids child parent family wife husband",
  work:     "job meeting manager desk shift office work boss interview exam nights",
  home:     "flat house landlord lease damp box boxes packed move moving shelf washing bin wardrobe kitchen",
  sea:      "swim swam swimming sea water beach pier burrow tide",
  garden:   "garlic bulbs planted plant garden lawn mowed allotment",
  health:   "dentist results pharmacy doctor hospital sleep slept tired filling",
  money:    "paid pay loan bill fiver money expensive cost",
  pets:     "dog cat",
};
const TOPIC_OF = new Map(Object.entries(TOPICS).flatMap(([t, words]) => words.split(" ").map(w => [w, t])));
const STOP = new Set("the a an and or but so of to in on at for with from by is was were be been it its this that i i'm i've i'd me my we our you your he him his she her they them their there then than as just again too very really not no didn't don't haven't had has have do did get got still about into out up down over one two all some any what when who how".split(" "));

function termsOf(text) {
  return new Set((text || "").toLowerCase().replace(/[^a-z' ]+/g, " ").split(/\s+/)
    .map(w => w.replace(/^'+|'+$/g, ""))
    .filter(w => w.length > 2 && !STOP.has(w))
    .map(w => w.length > 5 ? w.replace(/(ing|ed|es|s)$/, "") : w));
}
function topicsOf(text) {
  const words = (text || "").toLowerCase().replace(/[^a-z ]+/g, " ").split(/\s+/);
  return new Set(words.map(w => TOPIC_OF.get(w)).filter(Boolean));
}

// What you wrote that day, plus what you write about in general
function interestProfile(dayEntries, allEntries) {
  const text = es => es.map(e => e.text || "").join(" ");
  return {
    words: termsOf(text(dayEntries)),
    topics: topicsOf(text(dayEntries)),
    places: new Set(dayEntries.map(e => e.place).filter(Boolean)),
    history: topicsOf(text(allEntries)),
  };
}

function relatedness(e, p) {
  let score = 0;
  termsOf(e.text).forEach(w => { if (p.words.has(w)) score += 3; });
  topicsOf(e.text).forEach(t => { if (p.topics.has(t)) score += 2; else if (p.history.has(t)) score += 1; });
  if (e.place && p.places.has(e.place)) score += 2;
  return score;
}

// The public row for a day: most related first, then the rest newest first, capped
function similarMoments(key) {
  const newest = (a, b) => b.createdAt - a.createdAt;
  const sameDay = OTHERS.filter(e => dayKey(e.createdAt) === key);
  const profile = interestProfile(state.entries.filter(e => dayKey(e.createdAt) === key), state.entries);
  return sameDay
    .map(e => ({ e, s: relatedness(e, profile) }))
    .sort((a, b) => b.s - a.s || newest(a.e, b.e))
    .slice(0, PUBLIC_ROW_CAP)
    .map(x => x.e);
}

/* One sideways timeline. Each day is a column of a single grid:
     row 1  "Your timeline (n posts)"
     row 2  your cards for that day
     row 3  the timeline line, with that day's date marker
     row 4  "Similar moments (n posts)" + its line
     row 5  public cards for that day, ending in "View full timeline ›"
   Swiping left moves back in time: past today's cards you reach NOV 7, then Nov 7's cards, and so on.
   The line runs unbroken through every column. Each day's headings and date stick to the left edge
   while that day passes, then get pushed off by the next — like the month labels. */
// focusKey: a day to include (even if empty) — the day screen then scrolls the band to it
function bothDayView(focusKey) {
  const keys = new Set([dayKey(new Date())]);
  if (focusKey) keys.add(focusKey);
  [...state.entries, ...OTHERS].forEach(e => keys.add(dayKey(e.createdAt)));
  const days = [...keys].sort().reverse();
  return `
    <div class="band" role="region" aria-label="Your timeline and similar moments, newest day first. Swipe to go back in time.">
      <div class="band-grid">${days.map((key, i) => bothDayColumn(key, i + 1)).join("")}</div>
    </div>`;
}

function bothDayColumn(key, col) {
  const d = parseDayKey(key);
  const newest = (a, b) => b.createdAt - a.createdAt;
  const mine = state.entries.filter(e => dayKey(e.createdAt) === key).sort(newest);
  const others = similarMoments(key);   // ranked by relatedness to what you wrote
  const marker = `${d.toLocaleDateString("en-GB", { month: "short" }).toUpperCase()} ${d.getDate()}`;
  const at = row => `style="grid-column:${col};grid-row:${row}"`;
  return `
    <div class="bc bc-head" ${at(1)}>

function timelineList(list) {

/* ============ Heat scale ============
   Two scales, because your own volume and everyone's are orders of magnitude apart.
   Each bucket covers counts up to and including `max`. `fg` is the text colour on that fill.

   Yours is relative to your own busiest day: the darkest colour means exactly that day's count,
   the three lighter steps split everything below it. The legend always shows the full scale.
   Public is a fixed scale. */
const HEAT_SCALES = {
  yours: {
    relative: true,
    steps: [
      { bg: "#F8FAE4", fg: "#1C1B19" },   // nothing
      { bg: "#E9EDCD", fg: "#1C1B19" },   // up to a third of your busiest
      { bg: "#EFE6A8", fg: "#1C1B19" },   // up to two thirds
      { bg: "#F1C673", fg: "#1C1B19" },   // more, but not your busiest
      { bg: "#BF2E53", fg: "#FFFFFF" },   // your busiest day
    ],
  },
  public: {
    buckets: [
      { max: 0,        bg: "#F8FAE4", fg: "#1C1B19" },
      { max: 20,       bg: "#E9EDCD", fg: "#1C1B19" },   // 1–20
      { max: 50,       bg: "#EFE6A8", fg: "#1C1B19" },   // 21–50
      { max: 70,       bg: "#F1C673", fg: "#1C1B19" },   // 51–70
      { max: 100,      bg: "#E47B43", fg: "#1C1B19" },   // 71–100
      { max: Infinity, bg: "#BF2E53", fg: "#FFFFFF" },   // 100+
    ],
    legend: ["0", "100+"],
  },
};
const NO_DATA = { bg: "#FEFFF8", fg: "#8C877F" };   // outside the month — never "zero"

// The most moments you've added on any single day (0 if none yet)
function busiestDay() {
  const perDay = {};
  state.entries.forEach(e => { const k = dayKey(e.createdAt); perDay[k] = (perDay[k] || 0) + 1; });
  return Math.max(0, ...Object.values(perDay));
}

// The buckets and legend for a scale. Yours is rebuilt from your busiest day. Every step is always
// present (so the legend shows the full scale); a step whose range is empty is simply never matched.
function scaleBuckets(scale) {
  const s = HEAT_SCALES[scale];
  if (!s.relative) return { buckets: s.buckets, legend: s.legend };
  const top = busiestDay();
  const [empty, light, mid, high, busiest] = s.steps;
  const buckets = [
    { max: 0, ...empty },
    { max: Math.floor(top / 3), ...light },
    { max: Math.floor((2 * top) / 3), ...mid },
    { max: top - 1, ...high },
    { max: Infinity, ...busiest },
  ];
  return { buckets, legend: ["0", top ? `${top} · your busiest day` : "your busiest day"] };
}

// cell colour = f(count, scale)
function heatColour(count, scale) {
  if (count === null || count === undefined) return NO_DATA;
  return scaleBuckets(scale).buckets.find(b => count <= b.max);
}

const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseDayKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const startOfToday = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };

// Everyone's public moments per day — simulated but stable for a given date (hundreds-scale)
function publicCount(d) {
  const seed = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  let x = Math.sin(seed * 12.9898) * 43758.5453; x -= Math.floor(x);
  const weekend = d.getDay() === 0 || d.getDay() === 6 ? 22 : 0;
  return Math.round(4 + x * 104 + weekend);
}

// Counts for a day in a scale. Days that haven't happened yet are simply empty (0) —
// grey is reserved for days outside the month.
function countFor(d, scale) {
  if (d > startOfToday()) return 0;
  const key = dayKey(d);
  if (scale === "yours") return state.entries.filter(e => dayKey(e.createdAt) === key).length;
  // Never fewer than the seeded entries you can actually scroll through for that day
  const seeded = OTHERS.filter(e => dayKey(e.createdAt) === key).length;
  return Math.max(publicCount(d), seeded) + state.entries.filter(e => e.public && dayKey(e.createdAt) === key).length;
}

function legend(scale) {
  const s = scaleBuckets(scale);
  return `<div class="legend" aria-label="Colour scale: ${s.legend[0]} to ${s.legend[1]}">
    <span>${s.legend[0]}</span>
    <span class="legend-swatches" aria-hidden="true">${s.buckets.map(b => `<i style="--sw:${b.bg}"></i>`).join("")}</span>
    <span>${s.legend[1]}</span>
  </div>`;
}

const WEEKDAYS = ["M", "T", "W", "T", "F", "S", "S"];

// One month grid in one scale. `texture` = short cells, no numbers (public grid in Both).
function monthGrid(year, month, scale, { title, texture = false } = {}) {
  const first = new Date(year, month, 1);
  const lead = (first.getDay() + 6) % 7;                       // Monday-first
  const days = new Date(year, month + 1, 0).getDate();
  const total = Math.ceil((lead + days) / 7) * 7;
  let sum = 0;
  const cells = [];
  for (let i = 0; i < total; i++) {
    const n = i - lead + 1;
    if (n < 1 || n > days) { cells.push(`<div class="cell outside${texture ? " texture" : ""}" aria-hidden="true"></div>`); continue; }
    const d = new Date(year, month, n);
    const count = countFor(d, scale);
    sum += count || 0;
    const c = heatColour(count, scale);
    const label = `${d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}, ${count === null ? "no data yet" : `${count} ${count === 1 ? "entry" : "entries"}`}`;
    cells.push(`<button class="cell${texture ? " texture" : ""}" style="--heat-bg:${c.bg};--heat-fg:${c.fg}" data-action="open-day" data-value="${dayKey(d)}" aria-label="${label}">${texture ? "" : `
      <span class="cell-date">${n}</span>${count ? `<span class="cell-count">${count}</span>` : ""}`}</button>`);
  }
  return `
    <div class="grid-head">
      ${title ? `<h3 class="grid-title serif">${title}</h3>` : ""}
      <span class="grid-count">${sum.toLocaleString("en-GB")} ${sum === 1 ? "Entry" : "Entries"}</span>
    </div>
    ${texture ? "" : `<div class="weekdays" aria-hidden="true">${WEEKDAYS.map(w => `<span>${w}</span>`).join("")}</div>`}
    <div class="mgrid">${cells.join("")}</div>
    ${legend(scale)}`;
}

// Continuous scroll: this month first, then further back in time. A year's worth.
function monthView() {
  const now = new Date();
  const sections = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const y = d.getFullYear(), m = d.getMonth();
    const name = d.toLocaleDateString("en-GB", { month: "short" }).replace(".", "") + (y !== now.getFullYear() ? ` ${y}` : "");
    const full = d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    const body = state.scope === "both"
      ? monthGrid(y, m, "yours", { title: "Your timeline" }) + `<div class="grid-gap"></div>` + monthGrid(y, m, "public", { title: "Public timeline", texture: true })
      : monthGrid(y, m, state.scope === "public" ? "public" : "yours");
    sections.push(`
      <section class="month" aria-label="${full}">
        <div class="month-rail"><h2 class="month-label">${name}</h2></div>
        <div class="month-body">${body}</div>
      </section>`);
  }
  return `<div class="months">${sections.join("")}</div>`;
}

/* ============ Day screen ============
   Opened from a month cell (in whichever view you're in), or from "View full timeline"
   in the Both day view, which opens it as Public ("#day/<date>/public") without changing your setting. */
function dayScreen(key, forced) {
  const d = parseDayKey(key);
  const scope = forced === "public" ? "public" : state.scope;
  activeScope = scope;
  const list = visibleEntries(scope).filter(e => dayKey(e.createdAt) === key);
  const pub = countFor(d, "public");
  const mine = list.filter(e => e.own).length;
  const publicLine = `${(pub || 0).toLocaleString("en-GB")} moments were shared publicly on this day`;
  const summary = scope === "yours"
    ? (mine ? `You added ${mine === 1 ? "one moment" : `${mine} moments`} on this day` : "")
    : scope === "both" ? `${publicLine}${mine ? ` · ${mine} of yours` : ""}`
    : publicLine;
  // Laid out like the timeline's day view for that scope: the sideways band for Both
  // (opened at this date, so you can keep swiping back), the spine list for Yours and Public.
  const both = scope === "both";
  return {
    mount() {
      if (!both) return;
      const band = document.querySelector("#stage .layer:not(.leaving) .band");
      const col = band && band.querySelector(`.bc-line[data-day="${key}"]`);
      if (col) band.scrollLeft = col.offsetLeft - 16;
    },
    html: `
      ${topbar()}
      <div class="day-head">
        <button class="btn-dark btn-round" data-action="back" aria-label="Back">${ICONS.back}</button>
        <h1 class="day-title serif">${d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "long" })}</h1>
      </div>
      <div class="segment-wrap">
        <div class="segment" role="group" aria-label="Whose moments">
          ${SCOPES.map(([k, l]) => `<button data-action="scope" data-value="${k}" aria-pressed="${scope === k}">${l}</button>`).join("")}
        </div>
      </div>
      ${both ? bothDayView(key)
      : `${summary ? `<p class="day-summary">${summary}</p>` : ""}
      ${list.length ? timelineList(list)
        : `<p class="day-empty">${scope === "yours" ? "You didn't add anything on this day." : "No sample moments to show for this day."}</p>`}`}`,
  };
}

// First-run intro: the spine grows up from the bottom, then the new card pops in. Runs once, ever.
function playFirstRun(entryId) {
  const spine = document.querySelector(".tl-spine");
  if (spine) motion(spine, [{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }],
    { duration: 500, easing: EASE_OUT }, [{ opacity: 0 }, { opacity: 1 }]);
  document.querySelectorAll(`[data-entry="${entryId}"]`).forEach(el =>
    motion(el, [{ opacity: 0, transform: "scale(0.96)" }, { opacity: 1, transform: "scale(1)" }],
      { duration: 260, easing: EASE_OUT, delay: 150, fill: "backwards" }, [{ opacity: 0 }, { opacity: 1 }]));
}

// Playback on a card's audio bar: real recordings play through an <audio> element;
// seeded entries (no recording) simulate the timer.
const player = new Audio();
player.preload = "auto";
function refreshBar(e) {
  const bar = document.getElementById(`audio-${e.id}`);
  if (bar) bar.outerHTML = audioBar(e);
}
function togglePlay(id) {
  const p = state.playing;
  stopPlayback();
  if (p && p.id === id) return;
  const e = [...state.entries, ...OTHERS].find(x => String(x.id) === String(id));
  if (!e) return;
  const clips = e.audio || [];
  state.playing = { id: e.id, elapsed: 0 };
  if (clips.length) {
    let i = 0, offset = 0;
    const playClip = () => { player.src = clips[i]; player.play().catch(() => stopPlayback()); };
    player.onended = () => {
      offset += e.audioClipSecs ? e.audioClipSecs[i] : 0;
      if (++i < clips.length) playClip(); else stopPlayback();
    };
    player.ontimeupdate = () => {
      if (!state.playing || state.playing.id !== e.id) return;
      const t = Math.floor(offset + player.currentTime);
      if (t !== state.playing.elapsed) { state.playing.elapsed = t; refreshBar(e); }
    };
    playClip();
  } else {
    state.playing.timer = setInterval(() => {
      state.playing.elapsed++;
      if (state.playing.elapsed >= e.audioDuration) { stopPlayback(); return; }
      refreshBar(e);
    }, 1000);
  }
  refreshBar(e);
}
function stopPlayback() {
  const p = state.playing;
  if (!p) return;
  clearInterval(p.timer);
  player.onended = player.ontimeupdate = null;
  player.pause();
  state.playing = null;
  const e = [...state.entries, ...OTHERS].find(x => x.id === p.id);
  if (e) refreshBar(e);
}

/* ============ Chapter view ============

const fmtShortDate = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

function chapterView(list) {

  const one = names.length === 1 ? names[0] : null;
  const closed = one && state.closedChapters[one];
  const moments = `${n} ${n === 1 ? "moment" : "moments"}`;
  const sub = closed ? `${fmtShortDate(since)} – ${fmtShortDate(closed)}, ${moments}` : `Open since ${fmtShortDate(since)}, ${moments}`;

}

        </section>`
      : timelineList(list)}
    `,
    actions,
  };
};

function renderCapture(instant) {

}

function renderAttachments(instant) {

/* --- Recording ---
   Real microphone audio (MediaRecorder) with a live level meter. Where the browser offers speech
   recognition the words appear as you speak; otherwise the recording is kept without words.
   If the mic isn't available at all (e.g. opened from a file), it falls back to the simulation. */
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && window.isSecureContext);
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
// On phones (iPhone/iPad Safari, Android Chrome) the browser can't transcribe while the page also holds the mic
// for audio: the words never arrive.
// There, transcription wins: words appear live, and the voice note keeps its length but not the sound.
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(navigator.userAgent);
const isPhone = isIOS || isAndroid;

// Safari only lets speech recognition start inside the tap itself, so it starts first (synchronously),
// before asking for the microphone stream.
function startRecording() {
  const c = state.capture, ta = $("entry-text");
  if (c.rec || c.starting) return;
  state.draft.text = ta.value;
  const rec = { started: Date.now(), elapsed: 0, base: state.draft.text, words: [], chunks: [] };
  if (!canRecord && !Speech) { rec.simulate = true; beginRecording(rec); return; }   // no mic at all: simulation
  if (Speech) startSpeech(rec);
  if (Speech && (isPhone || !canRecord)) { beginRecording(rec); return; }             // words only
  if (!Speech && isPhone && !state.capture.speechWarned) {                            // e.g. Samsung Internet
    state.capture.speechWarned = true;
    toast("Live words need Chrome — open this link in Chrome. Recording audio only.");
  }
  c.starting = rec;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    if (c.starting !== rec || !$("entry-text")) {               // cancelled or left the screen meanwhile
      stream.getTracks().forEach(t => t.stop()); stopSpeech(rec); return;
    }
    c.starting = null;
    rec.stream = stream;
    beginRecording(rec);
  }, err => {
    c.starting = null;
    stopSpeech(rec);
    toast(err && err.name === "NotAllowedError" ? "Allow microphone access to record" : "Couldn't start the microphone");
  });
}

const SPEECH_FATAL = ["not-allowed", "service-not-allowed", "audio-capture", "language-not-supported", "network"];
function startSpeech(rec) {
  rec.finalText = "";
  rec.speechOn = true;
  rec.speechTried = true;
  const active = () => rec.speechOn && (state.capture.rec === rec || state.capture.starting === rec);
  const listen = () => {
    const sr = new Speech();
    sr.lang = /^en/i.test(navigator.language) ? navigator.language : "en-GB";
    sr.continuous = !isAndroid;   // Android Chrome repeats words in continuous mode; one phrase at a time, restarted
    sr.interimResults = true;
    sr.onresult = ev => {
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) rec.finalText += r[0].transcript.trim() + " ";
        else interim += r[0].transcript;
      }
      rec.words = (rec.finalText + interim).trim().split(/\s+/).filter(Boolean);
      rec.heard = true;
      if (state.capture.rec === rec) updateLive();
    };
    sr.onerror = ev => {
      if (!SPEECH_FATAL.includes(ev.error)) return;             // "no-speech" / "aborted": just listen again
      rec.speechOn = false;
      rec.warned = true;
      if (state.capture.rec === rec || state.capture.starting === rec)
        toast(ev.error === "not-allowed" || ev.error === "service-not-allowed"
          ? "Turn on Dictation (Settings › General › Keyboard) for live words"
          : "Live words aren't available here — recording audio only");
    };
    sr.onend = () => {
      // Safari ends recognition after a pause; carry on while still recording (keeping the words so far)
      if (active()) setTimeout(() => { if (active()) listen(); }, 60);
    };
    rec.sr = sr;
    try { sr.start(); } catch (_) { rec.speechOn = false; }
  };
  listen();
}
function stopSpeech(rec) {
  rec.speechOn = false;
  if (rec.sr) { try { rec.sr.stop(); } catch (_) {} }
}

function beginRecording(rec) {
  const c = state.capture, ta = $("entry-text");
  c.rec = rec;
  rec.started = Date.now();
  ta.hidden = true;
  $("live-text").hidden = false;
  updateLive();
  renderTools(); renderAddButton();

  if (rec.stream) {
    // Audio
    rec.recorder = new MediaRecorder(rec.stream);
    rec.recorder.ondataavailable = ev => { if (ev.data && ev.data.size) rec.chunks.push(ev.data); };
    rec.recorder.start();
    // Level meter
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      rec.ctx = new AC();
      rec.analyser = rec.ctx.createAnalyser();
      rec.analyser.fftSize = 512;
      rec.ctx.createMediaStreamSource(rec.stream).connect(rec.analyser);
      rec.levels = new Uint8Array(rec.analyser.fftSize);
    } catch (_) {}
  } else if (rec.simulate) {
    rec.wordTimer = setInterval(() => {
      rec.words.push(SPEECH[c.speechPos % SPEECH.length]);
      c.speechPos++;
      updateLive();
    }, 380);
  }

  rec.tick = setInterval(() => {
    rec.elapsed = Math.floor((Date.now() - rec.started) / 1000);
    const t = $("rec-time"); if (t) t.textContent = fmtTime(rec.elapsed);
    let base = null;
    if (rec.analyser) {
      rec.analyser.getByteTimeDomainData(rec.levels);
      let sum = 0;
      for (const v of rec.levels) sum += ((v - 128) / 128) ** 2;
      base = Math.min(1, Math.sqrt(sum / rec.levels.length) * 6);
    }
    const level = () => (base === null ? 0.25 + Math.random() * 0.75 : 0.15 + base * (0.55 + Math.random() * 0.45)).toFixed(2);
    document.querySelectorAll("#meter i").forEach(b => {
      if (reduceMotion.matches) b.style.opacity = level();       // no transforms with reduced motion
      else b.style.transform = `scaleY(${level()})`;
    });
  }, 140);
}

function spokenText(rec) {
  const sep = rec.base && !/\s$/.test(rec.base) && rec.words.length ? " " : "";
  return rec.base + sep + rec.words.join(" ");
}

function updateLive() {
  const rec = state.capture.rec;
  const sep = rec.base && !/\s$/.test(rec.base) && rec.words.length ? " " : "";
  const settled = rec.base + sep + rec.words.slice(0, -1).join(" ");
  const interim = rec.words.length ? (rec.words.length > 1 ? " " : "") + rec.words[rec.words.length - 1] : "";
  $("live-text").innerHTML = esc(settled) + `<span class="interim">${esc(interim)}</span><span class="caret"></span>`;
}

function stopRecording() {
  const c = state.capture, rec = c.rec;
  c.starting = null;                                               // cancels a start still waiting on the mic
  if (!rec) return;
  clearInterval(rec.wordTimer); clearInterval(rec.tick);
  const secs = Math.max(1, Math.round((Date.now() - rec.started) / 1000));
  stopSpeech(rec);
  if (rec.ctx) rec.ctx.close().catch(() => {});
  const draft = state.draft;
  if (rec.recorder && rec.recorder.state !== "inactive") {
    rec.recorder.onstop = () => {
      rec.stream.getTracks().forEach(t => t.stop());
      if (!rec.chunks.length) return;
      const blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || rec.chunks[0].type });
      const t = draft.savedAs || draft;   // if Add Moment was tapped before the clip finished, it goes on the saved entry
      t.audio = [...(t.audio || []), URL.createObjectURL(blob)];
      t.audioClipSecs = [...(t.audioClipSecs || []), secs];
    };
    rec.recorder.stop();
  } else if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
  draft.text = spokenText(rec);                               // tapping mic again appends
  if (rec.speechTried && !rec.heard && !rec.warned && secs >= 3)
    toast("No words came through. Check Dictation is on in Settings › General › Keyboard");
  draft.audioDuration = (draft.audioDuration || 0) + secs;
  c.rec = null;
  const ta = $("entry-text");
  if (!ta) return;                                                 // navigated away mid-recording
  ta.value = draft.text;
  ta.hidden = false;
  $("live-text").hidden = true;
  autosize(ta);
  renderAttachments(); renderTools(); renderAddButton();
}

/* --- Save --- */
function addMoment() {
  if (state.capture.rec) return;
  const d = state.draft;
  d.text = $("entry-text").value.trim();
  if (!d.text && !d.audioDuration && !d.photo && !d.place) { $("entry-text").focus(); return; }
  const entry = { ...d, id: state.nextId++, own: true, createdAt: new Date() };
  d.savedAs = entry;
  state.entries.unshift(entry);
  state.draft = newDraft();
  state.capture.naming = false;
  if (state.firstRun === "pending") {
    state.firstRun = "play";   // the timeline plays its intro once, on this first arrival
    state.scope = "yours";     // so the first entry is the one on screen
  }
  location.hash = "#timeline";
}

try { localStorage.removeItem("tyww-name"); } catch (_) {}   // clear the name older versions saved

/* ============ Placeholder screens ============ */
function placeholder(route) {
